[project]
name = "vpp-witness"
version = "0.1.0"
description = "A small C2SP tlog-witness for VPP ledgers (and any C2SP checkpoint log)"
requires-python = ">=3.12"
# Must never depend on `vpp` (the log it watches). Uses the independent verifier's primitives.
dependencies = [
    "pynacl>=1.5",
    "vpp-verify",
]

[project.scripts]
vpp-witness = "vpp_witness.server:main"

[tool.uv.sources]
vpp-verify = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpp_witness"]
