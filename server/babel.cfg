# pybabel extract config (scripts/i18n.sh); paths are relative to src/vpp. The options match the
# runtime Jinja setup in web/templating.py, so extracted msgids are exactly the ones pages look up.
[python: **.py]

[jinja2: web/templates/**.html]
extensions = jinja2.ext.i18n
newstyle_gettext = true
trimmed = true
