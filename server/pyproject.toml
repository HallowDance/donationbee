[project]
name = "vpp"
version = "0.1.0"
description = "Verified Payment Proofs server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pynacl>=1.5",
    "rfc8785>=0.1.4",
    "stripe>=16",
    "opentimestamps-client>=0.7",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "webauthn>=2.2",
    "cbor2>=5.6",
    "cryptography>=43",
    "donationbee-verify",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
gcp = ["google-cloud-kms>=3", "google-crc32c>=1.5"]

[project.scripts]
vpp = "vpp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpp"]

[tool.uv.sources]
donationbee-verify = { workspace = true }

[dependency-groups]
dev = []
