# /etc/nginx/sites-available/bee.theorycorner.com  (then symlink into sites-enabled)
# Proxies to the app (systemd/donationbee-web.service) on the server's loopback.
# Get TLS with:  sudo certbot --nginx -d bee.theorycorner.com
server {
    listen 80;
    listen [::]:80;
    server_name bee.theorycorner.com;

    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # While the app restarts, say so instead of a bare 502.
    error_page 502 503 504 = @offline;
    location @offline {
        default_type text/plain;
        return 503 "DonationBee beta is napping (restarting). Try again in a minute.\n";
    }
}
