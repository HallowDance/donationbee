[project]
name = "payment-proofs"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["server", "verifier", "witness"]

[tool.uv.sources]
vpp = { workspace = true }
donationbee-verify = { workspace = true }
vpp-witness = { workspace = true }

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "verifier/tests", "witness/tests"]
addopts = "--import-mode=importlib"
