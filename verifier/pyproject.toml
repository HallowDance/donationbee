[project]
name = "donationbee-verify"
version = "0.1.2"
description = "Independent verifier for DonationBee payment ledgers: checks every hash, signature, witness and anchor itself"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Ivo Iliev" }]
requires-python = ">=3.12"
keywords = ["transparency-log", "verification", "c2sp", "merkle-tree", "donations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security :: Cryptography",
]
# Deliberately minimal and must never depend on `vpp`: the verifier checks the spec, not our code.
dependencies = [
    "httpx>=0.27",
    "pynacl>=1.5",
    "rfc8785>=0.1.4",
    "cryptography>=43",  # WebAuthn assertions (ES256 / EdDSA / RS256)
]

[project.urls]
Homepage = "https://bee.theorycorner.com"
Source = "https://github.com/HallowDance/donationbee"
Specification = "https://github.com/HallowDance/donationbee/blob/master/docs/LEDGER_SPEC.md"

[project.scripts]
vpp-verify = "vpp_verify.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vpp_verify"]
